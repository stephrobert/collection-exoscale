ancestor: null
releases:
  0.1.0:
    changes:
      minor_changes:
        - 'An action module that leads to a known state (``start``, ``stop``) reads
          the resource before acting and answers ``changed: false`` when the state
          is already reached; after the asynchronous operation succeeds, it reads
          the resource again and fails if the expected state is not observed. An action
          that always acts (``reboot``) never reports ``changed: false``. Check mode
          reports what would change without calling the API.'
        - An action that answers at once rather than with an operation returns its
          response under ``result`` instead of ``operation``, and its documentation
          says which actions wait and which do not.
        - An information module without a list operation reads its resource unconditionally
          and requires every path identifier (``organization_info``, ``compute_load_balancer_service_info``);
          an action module accepts resources with zero or two shared identifiers (``iam_organization_policy_action``,
          ``sks_cluster_nodepool_action``).
        - 'Every product of the Exoscale API v2 document is now indexed, fourteen
          root tags instead of one: ai, audit-trail, block-storage, ccm, compute,
          dbaas, dns, general, iam, kms, organization, quotas, sks and sos. Every
          operation of every product is classified with zero UNKNOWN; what is set
          aside (a relation Terraform declares, a deletion, a value computed without
          changing anything) is set aside with its reason in the generator''s overrides.'
        - 'Module names no longer repeat the product when the API path already carries
          it: ``sks_cluster_info`` rather than ``sks_sks_cluster_info``.'
        - New inventory plugin ``stephrobert.exoscale.compute``. It discovers instances
          zone by zone with one API client per zone, reads the leases of every private
          network to give each machine its private addresses, names hosts from a chosen
          source (``name``, ``id``, an address family or ``label:KEY``) without ever
          letting two machines overwrite each other, chooses ``ansible_host`` by address
          family or by a named private network, builds ``exo_*`` groups by product,
          zone, state, label, private network, manager and instance type, and says
          why a machine was set aside. A refused credential fails the inventory; a
          missing permission on private networks is a warning.
        - 'The inventory plugin gains ``default_zone`` (environment ``EXOSCALE_ZONE``),
          the zone recorded on hosts when ``api_url`` is set and ``zones`` is empty.
          A forced endpoint with neither fails the inventory rather than discovering
          nothing. Label filters are applied by the plugin itself: the API refuses
          the ``labels`` query parameter.'
        - 'The modules and the inventory plugin read the API endpoint from ``EXOSCALE_API_URL``,
          then from ``EXOSCALE_API_ENDPOINT``, the variable the Exoscale SDK and the
          feint emulator already use. The value carries the ``/v2`` suffix, and it
          replaces the zone-based host: every zone is served by that one endpoint.'
      release_summary: 'First release of the collection. Every module is produced
        by the generator from the versioned Exoscale API v2 contract: information
        modules read one resource or list them, action modules trigger a one-shot
        operation on an existing resource and wait for the asynchronous operation
        to succeed. Nothing creates, deletes or links resources; Terraform provisions,
        this collection operates.'
    fragments:
      - api-endpoint.yml
      - dynamic-inventory.yml
      - every-product.yml
      - first-release.yml
      - stateful-actions.yml

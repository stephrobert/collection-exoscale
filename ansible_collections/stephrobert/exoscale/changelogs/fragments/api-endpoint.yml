---
minor_changes:
  - >-
    The modules and the inventory plugin read the API endpoint from
    ``EXOSCALE_API_URL``, then from ``EXOSCALE_API_ENDPOINT``, the variable the
    Exoscale SDK and the feint emulator already use. The value carries the
    ``/v2`` suffix, and it replaces the zone-based host: every zone is served
    by that one endpoint.
  - >-
    The inventory plugin gains ``default_zone`` (environment
    ``EXOSCALE_ZONE``), the zone recorded on hosts when ``api_url`` is set and
    ``zones`` is empty. A forced endpoint with neither fails the inventory
    rather than discovering nothing. Label filters are applied by the plugin
    itself: the API refuses the ``labels`` query parameter.

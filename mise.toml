# mise : outillage épinglé et lanceur de tâches.
#
#   mise install        installe l'outillage et crée le venv
#   mise run setup      installe les dépendances de développement
#   mise tasks          liste ce qui est lançable
#   mise run check      ce qu'une pull request doit passer
#
# Une seule définition par tâche, et la CI appelle ces tâches plutôt que de
# recopier leurs commandes : une CI qui diverge du lanceur ne mesure pas ce
# qu'on croit.

[tools]
python = "3.12"
# Le style et le typage sont épinglés ici plutôt que laissés à la version
# installée sur la machine : un lint qui change d'avis d'un poste à l'autre
# n'est pas un contrôle, c'est une loterie.
ruff = "0.16.5"
# uv ne sert qu'à recalculer le verrou des dépendances. Épinglé pour la même
# raison : l'outil qui décide quelles versions entrent ne change pas d'avis.
uv = "0.11.26"
# Terraform déploie la plateforme d'exemple. Épinglé pour la même raison que
# le fournisseur l'est dans `examples/stack/providers.tf` : ce qui applique
# une stack ne change pas de version sans qu'une ligne ait bougé ici.
terraform = "1.15.4"

[env]
_.python.venv = { path = ".venv", create = true }
# Le feint que `feint:install` construit prime sur celui du poste : la release
# publiée refuse encore le fournisseur Terraform, voir la tâche.
_.path = ["{{config_root}}/build/bin"]

# ---- Environnement ---------------------------------------------------------

[tasks.setup]
description = "Installer les dépendances de développement depuis le verrou"
# `--require-hashes` : pip refuse une archive dont l'empreinte ne correspond
# pas, et toute dépendance absente du verrou. `--no-build-isolation` : sans
# lui, pip télécharge le backend de construction hors du verrou, et rouvre la
# porte que le verrou ferme. `uv pip` et non `python -m pip` : un venv créé par
# uv ne contient pas pip, mesuré en CI par collection-scaleway.
run = """
uv pip install --require-hashes --requirement requirements-dev.lock
uv pip install --editable . --no-deps --no-build-isolation
"""

[tasks.lock]
description = "Recalculer le verrou des dépendances après un changement de pyproject.toml"
# Le verrou se relit comme un diff : c'est là qu'une dépendance qui apparaît se
# voit. Le régénérer sans lire son diff annule le mécanisme, comme un golden.
run = "uv pip compile pyproject.toml --extra dev --generate-hashes --quiet -o requirements-dev.lock"

[tasks."setup:ansible"]
description = "Épingler une version d'ansible-core (ANSIBLE_CORE='>=2.17,<2.18')"
# La matrice de CI s'en sert pour éprouver chaque version que `meta/runtime.yml`
# déclare. Une version déclarée et jamais testée est une promesse sans preuve.
#
# C'est la seule installation du dépôt qui sorte du verrou, et c'est assumé :
# la plage de versions **est** le sujet du test.
#
# Guillemets et non apostrophes : dans `sh`, `${VAR:-défaut}` ne s'expanse pas
# entre apostrophes, et la chaîne partait littérale vers le résolveur.
run = 'uv pip install "ansible-core${ANSIBLE_CORE:->=2.17}"'

[tasks.security]
description = "Juger les workflows : actionlint, zizmor, poutine"
# Les mêmes portes que la CI, lançables avant de pousser. Elles échouent quand
# l'outil est absent au lieu de se sauter : un contrôle qui se saute tout seul
# finit par ne plus jamais tourner.
run = """
actionlint -color
zizmor --no-progress --persona regular --min-severity low .github/workflows/
poutine analyze_local . --fail-on-violation --quiet
"""

[tasks."security:trust"]
description = "Juger la politique de confiance du pipeline : plumber"
# Séparé des trois autres : plumber déduit le fournisseur du remote git et
# refuse une copie de travail qui n'en a pas. Les trois scanners qui ne lisent
# que des fichiers restent lançables sans remote.
run = "plumber analyze --min-score B"

# ---- Contrôles rapides -----------------------------------------------------

[tasks.test]
description = "Lancer les tests du générateur et de la collection"
run = "python -m pytest tests/unit"

[tasks.lint]
description = "Vérifier le style"
run = """
ruff check generator scripts tests
ruff format --check generator scripts tests
"""

[tasks.typecheck]
description = "Vérifier les types"
run = "python -m mypy"

[tasks."lint:changelog"]
description = "Juger les fragments de changelog"
# Un fragment mal formé ne se voit qu'au moment de publier, c'est-à-dire au
# pire moment. Le linter le dit tout de suite.
run = "python scripts/changelog.py lint"

[tasks.falsify]
description = "Prouver que les gardes mordent, en les neutralisant hors dépôt"
run = "python scripts/falsify.py"

# ---- Générateur ------------------------------------------------------------

[tasks.products]
description = "Recenser le document entier, produit par produit, avec les UNKNOWN de chacun"
run = "python -m generator products --classify"

[tasks.report]
description = "Recensement, puis rapport strict de chaque produit indexé"
# Chaque produit de l'index, pas un seul : la liste vient de `products.txt`,
# elle n'est pas recopiée.
run = "python scripts/report_all.py"

[tasks.generate]
description = "Écrire les modules de chaque produit indexé dans plugins/modules"
# Tous les produits de l'index, dans une seule collection. Une tâche par
# produit laisserait la porte ouverte à n'en lancer qu'une, et
# `check:generated` mesurerait alors un arbre à moitié régénéré.
run = "python scripts/generate_all.py"

[tasks."sync:api"]
description = "Retélécharger le contrat depuis openapi-v2.exoscale.com"
run = "python scripts/sync_specs.py"

[tasks.drift]
description = "Dire ce que le contrat téléchargé change pour le générateur"
# À lancer après `sync:api`. Sort en 3 quand quelque chose a bougé, code
# distinct des trois que la CI connaît : une dérive n'est pas une erreur du
# dépôt, c'est une nouvelle du monde extérieur. Un seul document porte tous
# les produits, donc le rapport recense produit par produit, indexé ou non.
run = "python scripts/drift_report.py"

[tasks."golden:update"]
description = "Régénérer les golden fixtures, après lecture du diff"
run = "python scripts/update_golden.py"

# ---- Dérive ----------------------------------------------------------------

[tasks."check:generated"]
description = "Échouer si un artefact versionné n'est plus à jour"
# `git diff --exit-code` seul ne verrait pas un module tout neuf, produit et
# jamais commité : le script regarde aussi les fichiers non suivis.
depends = ["golden:update", "generate"]
run = "python scripts/check_generated.py tests/fixtures ansible_collections"

[tasks."check:worktree"]
description = "Échouer si un build a laissé un fichier non ignoré"
run = "python scripts/check_generated.py ."

# ---- Collection ------------------------------------------------------------

[tasks.sanity]
description = "Lancer ansible-test sanity sur la collection"
# Le script refuse un vert obtenu sur zéro fichier examiné : `ansible-test`
# demande la liste des fichiers à git, et sort en 0 quand elle est vide.
depends = ["generate"]
run = "python scripts/sanity.py"

[tasks.docs]
description = "Juger la documentation, puis produire les pages RST"
# `antsibull-docs` voit ce qu'`ansible-test sanity` laisse passer : sur une
# référence croisée invalide, sanity sort en 0 et lui en 3.
depends = ["generate"]
run = "python scripts/docs.py"

[tasks."lint:docs"]
description = "Juger la documentation sans produire de pages"
depends = ["generate"]
run = "python scripts/docs.py --lint"

[tasks.package]
description = "Construire l'archive installable, et la vérifier"
# Une archive qui existe ne prouve rien : le script contrôle son contenu,
# l'installe dans un répertoire jetable, puis demande sa documentation à
# `ansible-doc`. Tout ce que `plugins/` porte sur le disque doit y être.
depends = ["generate"]
run = "python scripts/package.py"

[tasks."release:check"]
description = "Ce qui doit être vrai avant de publier sur Galaxy"
# **Hors de `check`**, et c'est délibéré : cette garde exige un tag qui désigne
# HEAD et un arbre propre, donc elle refuserait toute pull request. C'est le
# workflow de release qui l'appelle.
run = "python scripts/release.py --check"

[tasks.readme]
description = "Réécrire les compteurs des deux README depuis ce qui est mesuré"
# Un nombre recopié à la main vieillit en silence, et se lit exactement comme
# une mesure. Les deux README sortent du même script.
depends = ["report", "generate"]
run = "python scripts/readme_counters.py --write"

[tasks."readme:check"]
description = "Échouer si les compteurs d'un README ont vieilli"
depends = ["report", "generate"]
run = "python scripts/readme_counters.py --check"

# ---- La plateforme d'exemple ----------------------------------------------

[tasks."feint:install"]
description = "Construire feint depuis le commit qui accepte le fournisseur Terraform, dans build/bin"
# La release 0.12.1 de feint, du 1er septembre, refuse encore le fournisseur
# Terraform d'Exoscale par user agent ; le refus est levé sur `main` au commit
# 9074c0f du 5 septembre, sur une mesure. Tant qu'aucune release ne le porte,
# le poste et la CI construisent ce commit-là, par cette même commande, dans
# `build/bin` que `[env]` place en tête du PATH. Épinglé par SHA et non par
# branche, pour la raison qui vaut aux actions GitHub. Le jour où une release
# le porte, revenir à `stephrobert/setup-feint` en CI et retirer cette tâche.
run = "GOBIN={{config_root}}/build/bin go install github.com/stephrobert/feint/cmd/feint@9074c0fd1d267254bb51a3d097fe8510eafcc775"

[tasks.example]
description = "Déployer la plateforme d'exemple contre l'émulateur, l'exploiter, la détruire"
# feint émule Exoscale, sur un port qui n'est ni le sien par défaut (4599) ni
# celui de collection-scaleway (4877) : deux exercices qui se partagent un
# émulateur se détruisent l'un l'autre. La stack Terraform épingle le
# fournisseur à 0.71.0 : en dessous, il n'honorait EXOSCALE_API_ENDPOINT que
# pour un de ses deux clients, et un apply se scindait entre l'émulateur et un
# compte payant. Le lanceur relit la version résolue avant d'appliquer.
depends = ["generate"]
run = "python scripts/example.py emulateur"

[tasks."example:reel"]
description = "La même, contre l'organisation Exoscale réelle, encadrée par le contrôle de résidu"
# À lancer à la main, jamais depuis la CI, et jamais sans l'accord explicite du
# mainteneur : cette cible crée des ressources facturées sur le compte réel.
# Le lanceur la refuse sans `--compte-reel-accorde`, à passer soi-même après
# avoir demandé. La destruction est dans un `finally`, et le contrôle de résidu
# compare l'organisation avant et après.
depends = ["generate"]
run = "python scripts/example.py reel"

[tasks."example:residu"]
description = "Vérifier qu'aucune ressource de l'exemple ne survit sur l'organisation réelle"
run = "python scripts/residue.py verify"

[tasks."coverage:check"]
description = "Refuser un module livré qu'aucun playbook d'exemple n'appelle sans raison déclarée"
# Dans `check` : hors ligne, déterministe, il lit les clés de tâches des
# playbooks et le répertoire des modules, jamais un artefact de run. Un module
# écrit que rien n'exerce est un module dont on ignore s'il marche.
depends = ["generate"]
run = "python scripts/example_coverage.py --check"

[tasks."coverage:diff"]
description = "Comparer le dernier run réel au dernier run contre l'émulateur"
run = "python scripts/example_coverage.py --diff"

[tasks."coverage:example"]
description = "Les étages de couverture, et ce que le dernier run a joué"
run = "python scripts/example_coverage.py"

# ---- Le tout ---------------------------------------------------------------

[tasks.check]
description = "Ce qu'une pull request doit passer"
# Tout ce que le job Générateur et le job Archive de la CI portent, et rien de
# ce qui demande une autre version d'ansible-core ou le réseau. `package` en
# fait partie parce que c'est là qu'un contrôle sur l'archive a voyagé jusqu'en
# CI chez collection-scaleway, faute d'être dans `check`.
depends = [
  "lint",
  "typecheck",
  "test",
  "report",
  "check:generated",
  "lint:changelog",
  "falsify",
  "readme:check",
  "coverage:check",
  "package",
]

[tasks.clean]
description = "Supprimer les artefacts d'exécution"
# Le motif est quoté et passé à `find` : un glob non quoté sans correspondance
# est une erreur fatale sous zsh, pas un argument transmis.
run = """
rm -rf build .pytest_cache .ruff_cache .mypy_cache
find . -maxdepth 1 -name '*.egg-info' -exec rm -rf {} +
"""
